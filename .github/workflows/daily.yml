name: Daily holidays

on:
  schedule:
    - cron: "7 7 * * *"
    - cron: "37 7 * * *"
    - cron: "7 8 * * *"
    - cron: "37 8 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - id: d
        run: echo "date=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: sent_flag
          key: sent-${{ steps.d.outputs.date }}
      - run: python send_holidays.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

